<!-- 
  BASE COMPONENT TEMPLATE - Responsive Layout
  
  Cara Penggunaan:
  1. Copy file ini sebagai template baru
  2. Ganti TITLE dengan judul halaman
  3. Ganti ACTIVE_PAGE dengan class="active" pada sidebar menu yang sesuai
  4. Ganti CONTENT_SECTION dengan konten spesifik halaman
  
  Responsive Breakpoints:
  - Mobile: < 576px (sidebar hidden, full-width)
  - Tablet: 577px - 768px (sidebar toggleable)
  - Desktop: > 769px (sidebar visible by default)
-->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- META RESPONSIVE -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>BASE_TITLE - RS Sehat</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Page-specific styles -->
    <style>
        /* Tambahkan custom styles halaman di sini jika diperlukan */
    </style>
</head>
<body>
    <!-- WRAPPER: Contains sidebar and content -->
    <div class="d-flex" id="wrapper">
        
        <!-- SIDEBAR: Fixed left navigation -->
        <div class="bg-dark text-white" id="sidebar-wrapper">
            <!-- Brand/Logo -->
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom">
                <i class="bi bi-hospital"></i> RS Sehat
            </div>
            
            <!-- Navigation Menu -->
            <div class="list-group list-group-flush">
                <!-- Dashboard -->
                <a href="../index.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                
                <!-- Pasien -->
                <a href="pasien.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-people"></i> Pasien
                </a>
                
                <!-- Dokter -->
                <a href="dokter.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-person-badge"></i> Dokter
                </a>
                
                <!-- Jadwal Praktek -->
                <a href="jadwal.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-calendar-week"></i> Jadwal Praktek
                </a>
                
                <!-- Rawat Inap -->
                <a href="rawat-inap.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-hospital-fill"></i> Rawat Inap
                </a>
                
                <!-- Rekam Medis -->
                <a href="rekam-medis.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-file-medical"></i> Rekam Medis
                </a>
                
                <!-- Laporan -->
                <a href="laporan.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-bar-chart"></i> Laporan
                </a>
            </div>
        </div>
        <!-- END SIDEBAR -->

        <!-- PAGE CONTENT -->
        <div id="page-content-wrapper">
            <!-- TOPBAR: Header navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <!-- Sidebar Toggle Button -->
                    <button class="btn btn-dark" id="sidebarToggle" aria-label="Toggle Sidebar">
                        <i class="bi bi-list"></i>
                    </button>
                    <!-- Page Title -->
                    <span class="ms-3 fw-bold">BASE_PAGE_TITLE</span>
                    <!-- Optional: Add user menu or notifications -->
                </div>
            </nav>
            <!-- END TOPBAR -->

            <!-- MAIN CONTENT AREA -->
            <div class="container-fluid p-4">
                <!-- Content Header (Optional) -->
                <div class="page-header">
                    <h1 class="h3">BASE_PAGE_TITLE</h1>
                    <p class="text-muted">Deskripsi singkat halaman</p>
                </div>

                <!-- ACTION BAR: Buttons & Filters -->
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <!-- Primary Action Button -->
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="bi bi-plus-lg"></i> Tambah Data
                    </button>
                    
                    <!-- Search/Filter -->
                    <div class="input-group search-box">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Cari...">
                    </div>
                </div>
                <!-- END ACTION BAR -->

                <!-- DATA TABLE CARD -->
                <div class="card shadow">
                    <div class="card-body">
                        <!-- Responsive Table Wrapper -->
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Kolom 1</th>
                                        <th>Kolom 2</th>
                                        <th>Kolom 3</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Data rendered via JS -->
                                    <tr>
                                        <td colspan="4" class="text-center text-muted py-3">Tidak ada data</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <!-- END Responsive Table -->
                    </div>
                </div>
                <!-- END DATA TABLE CARD -->

            </div>
            <!-- END MAIN CONTENT AREA -->
        </div>
        <!-- END PAGE CONTENT -->
    </div>
    <!-- END WRAPPER -->

    <!-- MODAL FORM (Responsive) -->
    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Data</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                <!-- Modal Form -->
                <form id="dataForm">
                    <div class="modal-body">
                        <input type="hidden" id="formId">
                        
                        <!-- Form Fields (Responsive Grid) -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Field 1</label>
                                <input type="text" class="form-control" id="formField1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Field 2</label>
                                <input type="text" class="form-control" id="formField2" required>
                            </div>
                        </div>
                        
                        <!-- Add more fields as needed -->
                    </div>
                    
                    <!-- Modal Footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
                <!-- END Modal Form -->
            </div>
        </div>
    </div>
    <!-- END MODAL -->

    <!-- SCRIPTS -->
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Logic -->
    <script src="../js/app.js"></script>
    <!-- Page-specific Script -->

    <!-- Page-specific initialization -->
    <script>
        // Initialize page-specific logic here
        document.addEventListener("DOMContentLoaded", function() {
            console.log("Page loaded");
        });
    </script>
</body>
</html>
