<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Dokter - RS Sehat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark text-white" id="sidebar-wrapper">
            <div class="sidebar-heading text-center py-4 fs-4 fw-bold border-bottom">
                <i class="bi bi-hospital"></i> RS Sehat
            </div>
            <div class="list-group list-group-flush">
                <a href="../index.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="pasien.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-people"></i> Pasien
                </a>
                <a href="dokter.html" class="list-group-item list-group-item-action bg-dark text-white active">
                    <i class="bi bi-person-badge"></i> Dokter
                </a>
                <a href="jadwal.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-calendar-week"></i> Jadwal Praktek
                </a>
                <a href="rawat-inap.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-hospital-fill"></i> Rawat Inap
                </a>
                <a href="rekam-medis.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-file-medical"></i> Rekam Medis
                </a>
                <a href="laporan.html" class="list-group-item list-group-item-action bg-dark text-white">
                    <i class="bi bi-bar-chart"></i> Laporan
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper">
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-dark" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <span class="ms-3 fw-bold">Manajemen Dokter</span>
                </div>
            </nav>

            <div class="container-fluid p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <button class="btn btn-primary" onclick="openModal()"><i class="bi bi-plus-lg"></i> Tambah Dokter</button>
                    <div class="input-group search-box">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="searchInput" placeholder="Cari nama/spesialisasi...">
                    </div>
                </div>

                <div class="card shadow">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nama Dokter</th>
                                        <th>Spesialisasi</th>
                                        <th>No. HP</th>
                                        <th>Status</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Data render via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal fade" id="formModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tambah Dokter</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="dataForm">
                    <div class="modal-body">
                        <input type="hidden" id="formId">
                        <div class="mb-3">
                            <label class="form-label">Nama Dokter (beserta gelar)</label>
                            <input type="text" class="form-control" id="formNama" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Spesialisasi</label>
                            <select class="form-select" id="formSpesialisasi" required>
                                <option value="Umum">Umum</option>
                                <option value="Penyakit Dalam">Penyakit Dalam</option>
                                <option value="Anak">Anak</option>
                                <option value="Bedah">Bedah</option>
                                <option value="Kandungan">Kandungan</option>
                                <option value="Gigi">Gigi</option>
                                <option value="THT">THT</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">No. HP</label>
                            <input type="text" class="form-control" id="formHP" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="formStatus" required>
                                <option value="Aktif">Aktif</option>
                                <option value="Cuti">Cuti</option>
                                <option value="Non-aktif">Non-aktif</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/dokter.js"></script>
</body>
</html>
